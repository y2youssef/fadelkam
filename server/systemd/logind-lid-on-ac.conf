# Keep the laptop awake with the lid closed while it is plugged in, even at the login screen.
#
# Inside the KDE session this is already handled by Plasma's power settings (lid: do nothing).
# Before anyone logs in (e.g. after a reboot) systemd-logind handles the lid itself, and its
# default is to suspend, which stops polling (FAILURE_MODES #30). On battery it still suspends.
#
# Install (root), takes effect at the next boot:
#   sudo install -Dm644 ~/fadelkam/server/systemd/logind-lid-on-ac.conf /etc/systemd/logind.conf.d/we-quota.conf
[Login]
HandleLidSwitchExternalPower=ignore
